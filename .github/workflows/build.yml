name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run tests
        run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-debug jarvis.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Джарвис (последняя сборка)" --notes "Debug APK из ветки $GITHUB_REF_NAME" --prerelease
