name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run tests
        env:
          # Секреты подставляются только в приватном репозитории, чтобы ключи не попали в открытый APK
          YANDEX_API_KEY: ${{ github.event.repository.private && secrets.YANDEX_API_KEY || '' }}
          YANDEX_FOLDER_ID: ${{ github.event.repository.private && secrets.YANDEX_FOLDER_ID || '' }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest 2>&1 | tee build.log
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Exception" -A4 build.log | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -150 build.log > errors.txt
          gh release delete ci-errors --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ci-errors errors.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ошибки сборки" --notes "$GITHUB_SHA" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
          gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-debug jarvis.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Джарвис (последняя сборка)" --notes "Debug APK из ветки $GITHUB_REF_NAME" --prerelease
